[project]
name = "azura"
version = "6.1.0a"
description = "An advanced Discord music bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "anytree>=2.13.0",
    "click>=8.3.1",
    "colorlog>=6.10.1",
    "cryptography>=46.0.3",
    "cysystemd>=2.0.1",
    "django>=5.2.9",
    "django-cors-headers>=4.9.0",
    "django-sortedm2m>=4.0.0",
    "django-stubs>=6.0.2",
    "djangorestframework>=3.16.1",
    "hikari-lightbulb>=3.2.2",
    "hikari-miru>=4.2.0",
    "hikari[speedups]>=2.5.0",
    "jarowinkler>=2.0.1",
    "koe",
    "lolpython>=2.2.0",
    "music-assistant-client>=1.3.5",
    "music-tag>=0.4.3",
    "mutagen>=1.47.0",
    "orjson>=3.11.4",
    "pillow>=12.0.0",
    "pydeps>=3.0.6",
    "pyfiglet>=1.0.4",
    "python-pidfile>=3.1.1",
    "setproctitle>=1.3.7",
    "toml>=0.10.2",
    "tornado>=6.5.2",
    "uvicorn>=0.38.0",
    "uvloop>=0.22.1",
